<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Trace Review · NYC Housing Agent</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1b2330; --muted:#6b7480; --line:#e3e6eb; --soft:#f1f3f6; --sel:#eef2f9;
  --accent:#1f3a68; --accent-ink:#1f3a68;
  --user:#2f6fd6; --user-bg:#eef4fd;
  --agent:#2f8a5b; --agent-bg:#eef7f1;
  --think:#7b8490; --think-bg:#f7f8fa;
  --tool:#a86c12; --tool-bg:#fdf6ea; --tool-line:#efdcb8; --tool-res:#fff;
  --guard:#c2413a; --guard-bg:#fcefee;
  --note:#f8e08a; --note-bg:#fff8db; --note-line:#ecd98f; --note-edge:#c99a00;
  --sugg:#7d55cc; --sugg-bg:#f4effc; --sugg-hl:#ebe2fa;
  --pass:#2f8a5b; --fail:#c2413a; --review:#b7791f; --error:#6b7480; --blocked:#8a5a9e;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161d; --panel:#1a1f28; --ink:#e4e8ee; --muted:#97a0ad; --line:#2b323d; --soft:#232a35; --sel:#1f2b40;
    --accent:#1f3a68; --accent-ink:#9db8e8;
    --user:#6c9ef0; --user-bg:#18243a;
    --agent:#5cbf8a; --agent-bg:#16271f;
    --think:#8d96a3; --think-bg:#1c2129;
    --tool:#e0a54a; --tool-bg:#2a2216; --tool-line:#4a3a20; --tool-res:#1d1a14;
    --guard:#ef7a72; --guard-bg:#2e1a1a;
    --note:#6b5a14; --note-bg:#2a2614; --note-line:#4d4520; --note-edge:#d9b437;
    --sugg:#b195f0; --sugg-bg:#241e33; --sugg-hl:#352a52;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
code{font-family:var(--mono);font-size:12px}
.top{display:flex;align-items:center;gap:20px;padding:8px 18px;background:var(--accent);color:#fff;height:46px}
.top b{font-weight:600}
.tabs{display:flex;gap:4px}
.tabs button{padding:4px 12px;border-radius:6px;font-size:13px;border:0;background:none;color:#fff;opacity:.75;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.18);opacity:1}
.top .src{margin-left:auto;font-size:12px;display:flex;gap:8px;align-items:center}
.top select{font-size:12px;border-radius:5px;border:0;padding:3px 6px;max-width:360px;color:#1b2330;background:#fff}
.view{display:none;height:calc(100vh - 46px)}
.view.on{display:grid}
#v-traces{grid-template-columns:310px 1fr}
#v-modes,#v-labels{display:none;overflow:auto;padding:22px 26px}
#v-modes.on,#v-labels.on{display:block}
/* sidebar */
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.chip.on{border-color:var(--accent-ink);color:var(--accent-ink);background:var(--sel)}
.filters select,.filters input{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel)}
.filters input{flex:1;min-width:120px}
.counts{padding:7px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
#list{flex:1;overflow:auto}
.row{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--soft)}
.row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent-ink)}
.row .l1{display:flex;align-items:center;gap:6px;font-size:12.5px}
.row .id{font-family:var(--mono);font-weight:600}
.row .t{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .q{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.st{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap}
.st.pass{background:var(--pass)}.st.fail{background:var(--fail)}.st.needs_review,.st.review{background:var(--review)}
.st.error{background:var(--error)}.st.blocked{background:var(--blocked)}
.dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none;border:1px solid #c8cdd4}
.dot.on{background:#f0a400;border-color:#f0a400}
/* trace */
.main{overflow:auto;padding:20px 24px 80px;position:relative}
.empty{color:var(--muted);padding:40px}
.cols{display:flex;gap:20px;max-width:1060px}
.body{flex:1;min-width:0;max-width:760px}
.margin{width:250px;position:relative;flex:none}
.head{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:24px}
.head h1{margin:0 0 4px;font-size:17px;display:flex;gap:10px;align-items:center}
.head h1 .id{font-family:var(--mono)}
.tuple{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tuple span{font-size:11.5px;background:var(--soft);border-radius:4px;padding:1px 7px}
.tuple span i{font-style:normal;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.flag{font-size:11px;color:var(--guard);border:1px solid var(--guard);background:var(--guard-bg);border-radius:4px;padding:0 6px}
.sys{font-size:12.5px;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:28px;background:var(--panel)}
.sys>summary{cursor:pointer;opacity:.55}
.sys pre{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;opacity:.75;max-height:420px;overflow:auto}
.turnlabel{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:30px 0 8px}
.blk{border-left:3px solid;border-radius:0 8px 8px 0;padding:9px 13px;margin-bottom:6px;background:var(--panel)}
.role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;user-select:none}
.role .sub{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:6px}
.user{border-color:var(--user);background:var(--user-bg)}.user>.role{color:var(--user)}
.agent{border-color:var(--agent);background:var(--agent-bg)}.agent>.role{color:var(--agent)}
.agent.mid{border-left-style:dashed;opacity:.92}
.think{border-color:var(--think);background:var(--think-bg);font-style:italic;font-size:13px;opacity:.9}.think>.role{color:var(--think);font-style:normal}
.guard{border-color:var(--guard);background:var(--guard-bg);font-size:13px}.guard>.role{color:var(--guard)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.md p{margin:4px 0}.md ul,.md ol{margin:4px 0;padding-left:22px}.md h3{font-size:14px;margin:8px 0 2px}
.toolbox{border:1px solid var(--tool-line);border-radius:8px;background:var(--tool-bg);padding:8px 10px;margin:6px 0}
.toolbox>.role{color:var(--tool)}
.call{font-family:var(--mono);font-size:12.5px;margin:2px 0 6px;overflow-wrap:anywhere}
.call b{color:var(--tool)}
.res{font-family:var(--mono);font-size:12px;background:var(--tool-res);border:1px solid var(--tool-line);border-radius:6px;padding:6px 9px}
.res summary{cursor:pointer;overflow-wrap:anywhere}
.res pre{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto}
.res.err summary{color:var(--guard)}
.legacy{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.hl{background:var(--note);border-radius:2px;outline:2px solid transparent;cursor:pointer}
.hl.hover,.sg.hover{outline-color:var(--note-edge)}
.sg{background:var(--sugg-hl);border-bottom:2px dashed var(--sugg);cursor:pointer}
.pend{background:#b9d2fa;color:#1b2330}
.mnote{position:absolute;left:0;right:0;background:var(--note-bg);border:1px solid var(--note-line);border-left:3px solid var(--note-edge);border-radius:6px;padding:7px 9px;font-size:12.5px}
.mnote.hover{box-shadow:0 0 0 2px var(--note-edge)}
.mnote q{quotes:none;display:block;color:var(--muted);font-size:11.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnote .by{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.mnote .acts{visibility:hidden;display:flex;gap:8px}
.mnote:hover .acts{visibility:visible}
.mnote .acts button{border:0;background:none;padding:0;color:var(--accent-ink);cursor:pointer;font-size:10.5px}
.mnote.s{background:var(--sugg-bg);border-color:var(--sugg-hl);border-left-color:var(--sugg)}
.mnote textarea{width:100%;font-size:12.5px;border:1px solid var(--line);border-radius:5px;padding:4px;background:var(--panel)}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sugg)}
.btns{display:flex;gap:6px;margin-top:6px}
.btn{font-size:11.5px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:2px 9px;cursor:pointer}
.btn.ok{border-color:var(--sugg);color:var(--sugg)}
.btn.primary{border-color:var(--accent-ink);color:var(--accent-ink)}
.pop{position:absolute;left:0;right:0;z-index:5;background:var(--panel);border:1px solid var(--accent-ink);box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:8px;padding:8px;font-size:12px}
.pop q{quotes:none;display:block;color:var(--muted);font-size:11.5px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verdict{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;flex-wrap:wrap}
.verdict button{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 12px;cursor:pointer}
.verdict button.on[data-verdict="pass"]{background:var(--pass);border-color:var(--pass);color:#fff}
.verdict button.on[data-verdict="fail"]{background:var(--fail);border-color:var(--fail);color:#fff}
.verdict .small{margin-left:4px}
.you{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;border:1.5px solid;white-space:nowrap}
.you.pass{color:var(--pass);border-color:var(--pass)}.you.fail{color:var(--fail);border-color:var(--fail)}
.pop textarea{width:100%;font-size:13px;padding:6px 8px;border:1px solid var(--accent-ink);border-radius:5px;background:var(--panel);resize:vertical}
.pop .hint{color:var(--muted);margin-top:4px}
.expect{margin-top:40px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.expect>summary{padding:11px 16px;cursor:pointer;font-weight:600;font-size:13.5px}
.expect .in{padding:0 16px 14px;font-size:13px}
.ck{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)}
.ck .d{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.help{position:fixed;right:18px;bottom:14px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
/* modes */
.wide{max-width:1000px}
.wide h2{font-size:16px;margin:26px 0 10px}
.wide h2:first-child{margin-top:0}
.lead{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.mode h3{margin:0;font-size:14px;font-family:var(--mono);display:flex;gap:10px;align-items:center}
.mode .def{margin:4px 0 8px;font-size:13px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--note-edge)}
.ex{font-size:12.5px;padding:4px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.ex a{font-family:var(--mono);white-space:nowrap;cursor:pointer}
.small{font-size:11.5px;color:var(--muted)}
.pill{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);font-family:-apple-system,system-ui,sans-serif;font-weight:500}
/* labels */
table{border-collapse:collapse;background:var(--panel);font-size:12.5px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--soft)}
td select{font-size:12px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
td.missing select{border-color:var(--review);background:var(--note-bg)}
td input{font-size:12px;border:1px solid var(--line);border-radius:4px;width:180px;background:var(--panel)}
td a{font-family:var(--mono);cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <b>NYC Housing Agent · Trace review</b>
  <div class="tabs" role="tablist">
    <button data-view="traces" class="on">Traces</button><button data-view="modes">Failure modes</button><button data-view="labels">Labeling</button>
  </div>
  <div class="src"><label for="source">Source</label><select id="source"></select></div>
</div>

<div class="view on" id="v-traces">
  <aside class="side">
    <div class="filters" id="filters"></div>
    <div class="counts" id="counts"></div>
    <div id="list"></div>
  </aside>
  <main class="main" id="main"><div class="empty">Pick a trace.</div></main>
</div>
<div class="view" id="v-modes"><div class="wide" id="modes"></div></div>
<div class="view" id="v-labels"><div class="wide" id="labels"></div></div>

<div class="help" id="help">Select text → type a note → Enter. One note per trace, on the first failure. j / k: next / previous trace.</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const api = async (path, body) => {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
};
const store = {get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};

// --- Markdown (same rules as the public site) --------------------------------------
function inline(text) {
  let s = esc(text);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, l, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${l}</a>`);
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function md(src) {
  const out = []; let list = null, para = [];
  const fp = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const cl = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(src || "").split("\n")) {
    const line = raw.trimEnd();
    const b = line.match(/^\s*[-*•]\s+(.*)$/), n = line.match(/^\s*\d+[.)]\s+(.*)$/), h = line.match(/^#{1,6}\s+(.*)$/);
    if (b || n) { fp(); const t = b ? "ul" : "ol"; if (list !== t) { cl(); out.push(`<${t}>`); list = t; } out.push(`<li>${inline((b || n)[1])}</li>`); }
    else if (h) { fp(); cl(); out.push(`<h3>${inline(h[1])}</h3>`); }
    else if (!line.trim()) { fp(); cl(); }
    else { cl(); para.push(line); }
  }
  fp(); cl();
  return out.join("");
}

// --- App state ----------------------------------------------------------------------
const S = {
  sources: [], source: null, traces: [], current: null, review: {annotations: [], modes: [], suggestions: [], labels: []},
  version: "", view: "traces", filters: Object.assign({status: "all", group: "all", unreviewed: false, topic: "", intention: "", q: "", verdict: ""}, store.get("tv-filters", {})),
};
const annotationsFor = (key) => S.review.annotations.filter((a) => a.trace_key === key);
const suggestionsFor = (key) => S.review.suggestions.filter((s) => s.trace_key === key);
const verdictFor = (key) => (S.review.verdicts || []).find((v) => v.trace_key === key)?.value || null;
const reviewed = (key) => annotationsFor(key).length > 0 || !!verdictFor(key) || S.review.labels.some((l) => l.trace_key === key);
// The grader's pass/fail against yours; "needs review" and "error" never count as a disagreement.
const disagrees = (t) => { const v = verdictFor(t.key); return !!v && (t.status === "pass" || t.status === "fail") && v !== t.status; };
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3500); };

async function loadSources() {
  S.sources = (await api("/api/sources")).sources;
  const sel = $("#source");
  sel.innerHTML = S.sources.map((s) => `<option value="${esc(s.id)}">${esc(s.label)} · ${s.count}</option>`).join("")
    || `<option value="">No traces yet: run scenarios.runner or scripts/pull_traces.py</option>`;
  const saved = store.get("tv-source", null);
  S.source = S.sources.some((s) => s.id === saved) ? saved : (S.sources[0] || {}).id || null;
  if (S.source) sel.value = S.source;
}
async function loadTraces() {
  S.traces = S.source ? (await api(`/api/traces?source=${encodeURIComponent(S.source)}`)).traces : [];
  renderFilters(); renderList();
  const want = location.hash.slice(1) && decodeURIComponent(location.hash.slice(1));
  const pick = S.traces.find((t) => t.key === want) || S.traces.find((t) => t.key === store.get("tv-trace", ""));
  if (pick) openTrace(pick.key); else { S.current = null; $("#main").innerHTML = `<div class="empty">${S.traces.length ? "Pick a trace." : "No traces in this source."}</div>`; }
}
async function loadState() {
  const r = await api("/api/state");
  const before = S.review.suggestions.length;
  S.version = r.version; S.review = r;
  store.set("tv-review-backup", r);
  if (r.suggestions.length > before && before !== -1 && S.loaded) toast(`${r.suggestions.length - before} new suggestion(s)`);
  S.loaded = true;
}
async function poll() {
  try {
    const v = (await api("/api/version")).version;
    if (v !== S.version && !$(".pop") && !$(".mnote textarea")) { await loadState(); refresh(); }
  } catch {}
}
function refresh() {
  renderList();
  if (S.current) { renderHighlights(); renderMargin(); renderVerdict(); }
  if (S.view === "modes") renderModes();
  if (S.view === "labels") renderLabels();
}

// --- List and filters -----------------------------------------------------------------
function renderFilters() {
  const f = S.filters, isRun = (S.source || "").startsWith("run:");
  const count = (st) => S.traces.filter((t) => t.status === st).length;
  const statuses = isRun ? [["all", "All"], ["fail", "Fail"], ["needs_review", "Needs review"], ["pass", "Pass"], ["error", "Error"]]
                         : [["all", "All"], ["blocked", "Blocked"]];
  const values = (dim) => [...new Set(S.traces.map((t) => t.tuple[dim]).filter(Boolean))].sort();
  $("#filters").innerHTML =
    statuses.map(([v, l]) => `<span class="chip ${f.status === v ? "on" : ""}" data-f="status" data-v="${v}">${l}${v === "all" ? "" : " " + count(v)}</span>`).join("") +
    (isRun ? ["coverage", "challenge"].map((g) => `<span class="chip ${f.group === g ? "on" : ""}" data-f="group" data-v="${g}">${g[0].toUpperCase() + g.slice(1)}</span>`).join("") : "") +
    `<span class="chip ${f.unreviewed ? "on" : ""}" data-f="unreviewed">Not reviewed</span>` +
    (isRun ? ["topic", "intention"].map((d) => `<select data-sel="${d}"><option value="">${d} (all)</option>${values(d).map((v) => `<option ${f[d] === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`).join("") : "") +
    `<select data-sel="verdict">${[["", "your verdict (all)"], ["pass", "you: pass"], ["fail", "you: fail"], ["none", "you: not judged"], ...(isRun ? [["disagree", "you disagree with grader"]] : [])]
        .map(([v, l]) => `<option value="${v}" ${f.verdict === v ? "selected" : ""}>${l}</option>`).join("")}</select>` +
    `<input type="search" placeholder="Search messages" value="${esc(f.q)}" data-q>`;
}
$("#filters").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  const f = S.filters;
  if (c.dataset.f === "unreviewed") f.unreviewed = !f.unreviewed;
  else if (c.dataset.f === "group") f.group = f.group === c.dataset.v ? "all" : c.dataset.v;
  else f.status = c.dataset.v;
  store.set("tv-filters", f); renderFilters(); renderList();
});

function textNodes(el) { const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const out = []; while (w.nextNode()) out.push(w.currentNode); return out; }

}

  for (const a of items) {

let pending = null;

  const range = sel.getRangeAt(0);
  const startEl = (range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement).closest(".blk-text");
  const endEl = (range.endContainer.nodeType === 1 ? range.endContainer : range.endContainer.parentElement).closest(".blk-text");
  if (!startEl || startEl !== endEl) { if (startEl || endEl) toast("Select text within one block."); return; }

  const quote = startEl.textContent.slice(start, end);

  try {
    await api("/api/labels", {trace_key: row.dataset.key, mode: s.dataset.mode, value: s.value === "" ? null : Number(s.value), note: row.querySelector("input").value});
    await afterChange();
  } catch (err) { toast("Not saved: " + err.message); }
});

// --- Views and start -----------------------------------------------------------------------
function setView(v) {
  S.view = v;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  document.querySelectorAll(".view").forEach((el) => el.classList.toggle("on", el.id === "v-" + v));
  $("#help").style.display = v === "traces" ? "" : "none";
  if (v === "modes") renderModes();
  if (v === "labels") renderLabels();
  if (v === "traces") renderMargin();
}
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => setView(b.dataset.view));
$("#source").onchange = async (e) => { S.source = e.target.value; store.set("tv-source", S.source); S.current = null; history.replaceState(null, "", "#"); await loadTraces(); };

(async () => {
  try { await loadState(); } catch { S.review = store.get("tv-review-backup", S.review); toast("Server unreachable; showing the last saved review state."); }
  await loadSources(); await loadTraces();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
