[project]
name = "nyc-housing-agent"
version = "0.1.0"
description = "Q&A agent for NYC renters: rental laws and affordable housing lotteries"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "certifi>=2024.0",
    "anthropic>=2.8.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "server", "sources", "scenarios", "sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
